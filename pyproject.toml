[project]
name = "supoclip"
version = "0.1.0"
description = "AI-powered video clipping tool"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic-ai>=0.4.9",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "structlog>=24.0.0",
    "yt-dlp>=2025.7.21",
    "stamina>=23.2.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "pysubs2>=1.7.0",
    "Pillow>=10.0.0",
    "fonttools>=4.45.0",
    "groq>=0.4.0",
    "openai>=1.0.0",
    "parakeet-mlx>=0.1.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
    "greenlet>=3.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.19.1",
    "radon>=6.0.0",
    "grimp>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100"
markers = [
    "integration: real-output tests that invoke ffmpeg/produce artifacts",
]

[tool.mypy]
ignore_missing_imports = true
strict = false
python_version = "3.12"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "SIM", "FURB"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
]

[project.scripts]
supoclip = "src.main:main"

[tool.bandit]
# Justified, intentional patterns for this local ffmpeg/desktop app:
#   B104 — HOST defaults to 0.0.0.0 so the local UI is reachable on the LAN.
#   B404/B603 — subprocess (ffmpeg/ffprobe) is the core video engine; calls use
#               argument lists with shell=False and no untrusted-string interpolation.
#   B112 — try/except/continue in font-record parsing is a deliberate skip-bad-record.
skips = ["B104", "B404", "B603", "B112"]

[tool.deptry]
# Dev/test-only tooling and transitive-runtime deps that deptry can't see used.
pep621_dev_dependency_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# DEP002: required at runtime but not imported by name in src/ (web server stack,
# async sqlite driver, LLM client, multipart uploads) or used only by tests (Pillow).
DEP002 = [
    "fastapi",
    "uvicorn",
    "aiosqlite",
    "greenlet",
    "openai",
    "python-multipart",
    "Pillow",
]
# DEP003: imported directly but provided transitively (cv2 via mediapipe, mlx via parakeet-mlx).
DEP003 = ["cv2", "mlx"]
