[project]
name = "supoclip-backend"
version = "0.1.0"
description = "Python-based backend for SupoClip"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic-ai>=0.4.9",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "greenlet>=0.4.17",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2025.7.21",
    "moviepy>=2.2.1",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "fonttools>=4.45.0",
    "aiofiles>=23.2.0",
    "sse-starlette>=1.6.5",
    "parakeet-mlx>=0.1.0",
    "playwright>=1.57.0",
    "groq>=0.4.0",
    "openai>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
]
dev = [
    "radon>=6.0.0",
    "grimp>=3.0.0",
]

[tool.uv]
package = true

[tool.deptry]
# Ignore driver dependencies used by SQLAlchemy internally
# DEP002: aiosqlite/greenlet are SQLAlchemy driver deps, test deps are in optional-dependencies
# DEP003: mlx is transitive from parakeet-mlx
per_rule_ignores = {"DEP002" = ["aiosqlite", "greenlet", "pytest", "pytest-asyncio", "pytest-cov", "httpx"], "DEP003" = ["mlx"]}

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]

[project.scripts]
run-dev = "src.main:run_dev"
